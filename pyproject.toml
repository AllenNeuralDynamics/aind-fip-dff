[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-fip-dff"
dynamic = ["version"]
description = "Fiber photometry preprocessing: dF/F and motion-correction for NWB files"
authors = [{name = "Allen Institute for Neural Dynamics"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aind-data-schema==2.9.2",
    "aind-data-schema-models",
    "aind-ophys-utils==0.2.0",
    "hdmf-zarr==0.13.0",
    "joblib",
    "matplotlib==3.10.6",
    "pynwb==3.1.2",
    "pyyaml==6.0.3",
    "scikit-learn==1.7.2",
    "statsmodels==0.14.5",
]

[project.optional-dependencies]
# Send the capsule's logs to CloudWatch (needs AWS credentials); skipped when not installed.
cloudwatch = ["watchtower==3.4.0"]

[tool.setuptools.dynamic]
version = {attr = "aind_fip_dff.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aind_fip_dff*"]

[tool.setuptools.package-data]
aind_fip_dff = ["logging.yml"]
